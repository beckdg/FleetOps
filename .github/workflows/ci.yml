name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetops
          POSTGRES_PASSWORD: fleetops
          POSTGRES_DB: fleetops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fleetops -d fleetops_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://fleetops:fleetops@localhost:5432/fleetops_test?schema=public
      DATABASE_URL_TEST: postgresql://fleetops:fleetops@localhost:5432/fleetops_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @fleetops/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter @fleetops/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @fleetops/api prisma:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build API
        run: pnpm --filter @fleetops/api build
